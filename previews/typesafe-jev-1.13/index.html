<!DOCTYPE html>

</head>

    <h2>تحلیل Decisions</h2>
    <input id="jevModel" value="typesafe/jev-1.13" dir="ltr">

    <pre id="result" dir="ltr">—</pre>

<script src="app.js"></script>
