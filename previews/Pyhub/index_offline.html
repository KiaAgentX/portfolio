<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>Pyhub – Python Reference Pro</title>
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#0a0a14" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <style>
        :root {
            --neon-green: #00ff88;
            --neon-green-dim: rgba(0, 255, 136, 0.10);
            --neon-green-glow: rgba(0, 255, 136, 0.18);
            --neon-red: #ff3860;
            --neon-blue: #4fc3f7;
            --neon-blue-dim: rgba(79, 195, 247, 0.08);
            --neon-white: #e8e8f0;
            --dark-bg: #0a0a14;
            --sidebar-bg: rgba(10, 10, 20, 0.94);
            --card-bg: rgba(16, 16, 28, 0.80);
            --card-hover-bg: rgba(20, 20, 36, 0.92);
            --glass-border: rgba(255, 255, 255, 0.05);
            --glass-border-strong: rgba(0, 255, 136, 0.15);
            --radius: 14px;
            --radius-sm: 10px;
            --radius-xs: 7px;
            --font: 'Inter', 'Segoe UI', Tahoma, sans-serif;
            --transition: 0.28s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            --sidebar-w: 270px;
            --bottom-nav-h: 62px;
            --header-h: 56px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800;900&display=swap');

        html {
            scroll-behavior: smooth;
            height: 100%;
        }
        body {
            font-family: var(--font);
            background: var(--dark-bg);
            color: var(--neon-white);
            height: 100%;
            overflow: hidden;
            display: flex;
            position: relative;
        }

        /* ===== CANVAS ===== */
        #particles-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        /* ===== APP SHELL ===== */
        .app-shell {
            position: relative;
            z-index: 1;
            display: flex;
            width: 100%;
            height: 100vh;
            height: 100dvh;
        }

        /* ===== SIDEBAR ===== */
        .sidebar {
            width: var(--sidebar-w);
            min-width: var(--sidebar-w);
            height: 100%;
            background: var(--sidebar-bg);
            border-right: 1px solid var(--glass-border);
            display: flex;
            flex-direction: column;
            padding: 0;
            backdrop-filter: blur(20px);
            overflow-y: auto;
            overflow-x: hidden;
            transition: transform 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            z-index: 100;
            flex-shrink: 0;
        }

        .sidebar-header {
            padding: 1.2rem 1.2rem 0.8rem 1.2rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            flex-shrink: 0;
        }

        .sidebar-logo {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 1.3rem;
            font-weight: 900;
            color: var(--neon-green);
            text-decoration: none;
            letter-spacing: -0.3px;
        }
        .sidebar-logo .sub {
            font-weight: 300;
            color: rgba(232, 232, 240, 0.45);
            font-size: 0.7rem;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .sidebar-search-wrap {
            padding: 0.8rem 1.2rem;
            flex-shrink: 0;
        }

        .sidebar-search-wrap input {
            width: 100%;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.07);
            border-radius: 25px;
            padding: 0.55rem 1rem 0.55rem 2.2rem;
            color: var(--neon-white);
            font-family: var(--font);
            font-size: 0.82rem;
            outline: none;
            transition: 0.3s;
        }
        .sidebar-search-wrap input:focus {
            border-color: var(--neon-green-glow);
            box-shadow: 0 0 25px rgba(0, 255, 136, 0.05);
            background: rgba(255, 255, 255, 0.05);
        }
        .sidebar-search-wrap {
            position: relative;
        }
        .sidebar-search-wrap .search-icon {
            position: absolute;
            left: 1.6rem;
            top: 50%;
            transform: translateY(-50%);
            font-size: 0.85rem;
            color: rgba(232, 232, 240, 0.3);
            pointer-events: none;
        }

        .sidebar-nav {
            flex: 1;
            overflow-y: auto;
            padding: 0.4rem 0.6rem 1rem 0.6rem;
            display: flex;
            flex-direction: column;
            gap: 0.15rem;
        }

        .sidebar-nav .nav-section-title {
            font-size: 0.6rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: rgba(232, 232, 240, 0.2);
            padding: 0.7rem 0.6rem 0.3rem 0.6rem;
            font-weight: 700;
        }

        .sidebar-nav button {
            display: flex;
            align-items: center;
            gap: 0.55rem;
            width: 100%;
            text-align: left;
            background: transparent;
            border: none;
            color: rgba(232, 232, 240, 0.55);
            font-family: var(--font);
            font-size: 0.8rem;
            padding: 0.5rem 0.7rem;
            border-radius: var(--radius-xs);
            cursor: pointer;
            transition: 0.22s;
            white-space: nowrap;
            font-weight: 500;
        }
        .sidebar-nav button:hover {
            background: rgba(255, 255, 255, 0.02);
            color: var(--neon-white);
        }
        .sidebar-nav button.active {
            background: var(--neon-green-dim);
            color: var(--neon-green);
            font-weight: 700;
            box-shadow: inset 0 0 0 1px rgba(0, 255, 136, 0.1);
        }
        .sidebar-nav button .badge-cnt {
            margin-left: auto;
            font-size: 0.6rem;
            background: rgba(255, 255, 255, 0.04);
            padding: 0.15rem 0.5rem;
            border-radius: 15px;
            color: rgba(232, 232, 240, 0.3);
            font-weight: 600;
        }
        .sidebar-nav button.active .badge-cnt {
            background: rgba(0, 255, 136, 0.1);
            color: var(--neon-green);
        }

        .sidebar-footer {
            padding: 0.8rem 1.2rem;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            flex-shrink: 0;
            font-size: 0.6rem;
            color: rgba(232, 232, 240, 0.15);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .sidebar-footer .dot {
            width: 6px;
            height: 6px;
            background: var(--neon-green);
            border-radius: 50%;
            display: inline-block;
            animation: pulse-dot 2s infinite;
        }
        @keyframes pulse-dot {
            0%,
            100% {
                opacity: 0.4;
            }
            50% {
                opacity: 1;
            }
        }

        /* ===== MAIN CONTENT ===== */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
            overflow: hidden;
            position: relative;
        }

        .main-top-bar {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 0.6rem 1.5rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            flex-shrink: 0;
            background: rgba(10, 10, 20, 0.7);
            backdrop-filter: blur(12px);
            min-height: var(--header-h);
            flex-wrap: wrap;
        }

        .main-top-bar .breadcrumb {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            font-size: 0.8rem;
            color: rgba(232, 232, 240, 0.35);
            font-weight: 500;
        }
        .main-top-bar .breadcrumb .active-bread {
            color: var(--neon-white);
            font-weight: 700;
        }
        .main-top-bar .breadcrumb .sep {
            color: rgba(232, 232, 240, 0.15);
        }

        .main-top-bar .actions-row {
            margin-left: auto;
            display: flex;
            gap: 0.5rem;
            align-items: center;
            flex-wrap: wrap;
        }
        .main-top-bar .actions-row button {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: rgba(232, 232, 240, 0.55);
            padding: 0.35rem 0.9rem;
            border-radius: 20px;
            cursor: pointer;
            font-family: var(--font);
            font-size: 0.7rem;
            transition: 0.25s;
            white-space: nowrap;
            font-weight: 500;
        }
        .main-top-bar .actions-row button:hover {
            border-color: var(--neon-green-glow);
            color: var(--neon-white);
            background: rgba(0, 255, 136, 0.03);
        }
        .main-top-bar .actions-row button.fav-active {
            border-color: rgba(255, 215, 0, 0.3);
            color: #ffd700;
            background: rgba(255, 215, 0, 0.04);
        }

        .main-scroll {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 1.2rem 1.5rem 1.5rem 1.5rem;
            scroll-behavior: smooth;
        }

        /* ===== COMMAND LIST ===== */
        .command-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1rem;
        }

        .command-card {
            background: var(--card-bg);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius);
            padding: 1.1rem 1.2rem;
            cursor: pointer;
            transition: var(--transition);
            position: relative;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            min-height: 130px;
        }
        .command-card:hover {
            background: var(--card-hover-bg);
            border-color: var(--glass-border-strong);
            transform: translateY(-3px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4), 0 0 60px rgba(0, 255, 136, 0.03);
        }
        .command-card .card-top {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 0.5rem;
        }
        .command-card .card-icon {
            font-size: 1.5rem;
            flex-shrink: 0;
        }
        .command-card .card-name {
            font-weight: 700;
            font-size: 0.95rem;
            color: var(--neon-white);
            line-height: 1.3;
        }
        .command-card .card-cat-tag {
            font-size: 0.58rem;
            padding: 0.15rem 0.55rem;
            border-radius: 12px;
            background: var(--neon-blue-dim);
            border: 1px solid rgba(79, 195, 247, 0.1);
            color: var(--neon-blue);
            white-space: nowrap;
            font-weight: 600;
            flex-shrink: 0;
        }
        .command-card .card-syntax-preview {
            font-family: 'Courier New', monospace;
            font-size: 0.78rem;
            background: #141424;
            padding: 0.5rem 0.7rem;
            border-radius: var(--radius-xs);
            color: #b0d0ff;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            border-left: 3px solid var(--neon-green);
        }
        .command-card .card-desc {
            font-size: 0.78rem;
            color: rgba(232, 232, 240, 0.5);
            line-height: 1.5;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .command-card .card-actions {
            display: flex;
            gap: 0.5rem;
            align-items: center;
            margin-top: auto;
            padding-top: 0.4rem;
            border-top: 1px solid rgba(255, 255, 255, 0.03);
        }
        .command-card .card-actions button {
            background: transparent;
            border: none;
            color: rgba(232, 232, 240, 0.25);
            font-size: 0.7rem;
            cursor: pointer;
            padding: 0.25rem 0.5rem;
            border-radius: 12px;
            transition: 0.25s;
            font-family: var(--font);
        }
        .command-card .card-actions button:hover {
            color: var(--neon-green);
            background: rgba(0, 255, 136, 0.04);
        }
        .command-card .card-actions button.fav-btn.saved {
            color: #ffd700;
        }

        /* ===== EMPTY STATE ===== */
        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 3rem 1rem;
            color: rgba(232, 232, 240, 0.18);
        }
        .empty-state .icon {
            font-size: 3rem;
            display: block;
            margin-bottom: 0.6rem;
        }
        .empty-state .sub {
            font-size: 0.8rem;
            color: rgba(232, 232, 240, 0.12);
            margin-top: 0.3rem;
        }

        /* ===== DETAIL MODAL ===== */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            animation: fadeIn 0.2s ease-out;
        }
        .modal-overlay.closing {
            animation: fadeOut 0.2s ease-in forwards;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }
        @keyframes fadeOut {
            from {
                opacity: 1;
            }
            to {
                opacity: 0;
            }
        }

        .modal-card {
            background: #12121f;
            border: 1px solid var(--glass-border-strong);
            border-radius: var(--radius);
            padding: 1.5rem;
            max-width: 600px;
            width: 100%;
            max-height: 85vh;
            overflow-y: auto;
            box-shadow: 0 20px 70px rgba(0, 0, 0, 0.7);
            position: relative;
            animation: slideUp 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }
        @keyframes slideUp {
            from {
                transform: translateY(40px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }
        .modal-card .modal-close {
            position: absolute;
            top: 0.8rem;
            right: 1rem;
            background: transparent;
            border: none;
            color: rgba(232, 232, 240, 0.4);
            font-size: 1.4rem;
            cursor: pointer;
            transition: 0.3s;
            padding: 0.3rem 0.6rem;
            border-radius: 50%;
        }
        .modal-card .modal-close:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.04);
        }
        .modal-card h2 {
            font-size: 1.3rem;
            margin-bottom: 0.4rem;
            color: var(--neon-white);
        }
        .modal-card .modal-syntax {
            background: #1a1a2e;
            padding: 1rem;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 0.85rem;
            color: #b8e0ff;
            white-space: pre-wrap;
            margin: 0.8rem 0;
            cursor: pointer;
            position: relative;
            border-left: 3px solid var(--neon-green);
        }
        .modal-card .modal-example {
            background: #1e2a1e;
            padding: 0.7rem 1rem;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 0.82rem;
            color: #b8ffb8;
            border-left: 3px solid #4caf50;
            margin: 0.5rem 0;
        }
        .modal-card .modal-desc {
            color: rgba(232, 232, 240, 0.6);
            font-size: 0.9rem;
            line-height: 1.7;
        }

        /* ===== MOBILE BOTTOM NAV ===== */
        .bottom-nav {
            display: none;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: var(--bottom-nav-h);
            background: rgba(10, 10, 20, 0.95);
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            z-index: 200;
            backdrop-filter: blur(20px);
            justify-content: space-around;
            align-items: center;
            padding: 0 0.5rem;
            padding-bottom: env(safe-area-inset-bottom, 0);
        }
        .bottom-nav button {
            background: transparent;
            border: none;
            color: rgba(232, 232, 240, 0.35);
            font-family: var(--font);
            font-size: 0.6rem;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.25rem;
            padding: 0.4rem 0.8rem;
            border-radius: 12px;
            transition: 0.25s;
            font-weight: 600;
        }
        .bottom-nav button .nav-icon {
            font-size: 1.3rem;
        }
        .bottom-nav button.active {
            color: var(--neon-green);
        }

        /* ===== SIDEBAR OVERLAY (mobile) ===== */
        .sidebar-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.55);
            z-index: 99;
        }

        /* ===== TOAST ===== */
        .toast {
            position: fixed;
            bottom: 5rem;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: rgba(18, 18, 30, 0.95);
            border: 1px solid var(--glass-border-strong);
            border-radius: 25px;
            padding: 0.6rem 1.6rem;
            backdrop-filter: blur(16px);
            color: var(--neon-white);
            font-size: 0.8rem;
            font-weight: 600;
            z-index: 99999;
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.5);
            pointer-events: none;
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        .toast.success {
            border-color: var(--neon-green);
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 900px) {
            .sidebar {
                position: fixed;
                left: 0;
                top: 0;
                height: 100%;
                transform: translateX(-105%);
                box-shadow: 8px 0 40px rgba(0, 0, 0, 0.5);
                width: 280px;
                min-width: 280px;
            }
            .sidebar.open {
                transform: translateX(0);
            }
            .sidebar-overlay.show {
                display: block;
            }
            .main-content {
                width: 100%;
            }
            .main-scroll {
                padding: 0.8rem 0.8rem 5rem 0.8rem;
            }
            .main-top-bar {
                padding: 0.5rem 0.8rem;
                gap: 0.5rem;
            }
            .bottom-nav {
                display: flex;
            }
            .command-list {
                grid-template-columns: 1fr 1fr;
                gap: 0.7rem;
            }
            .command-card {
                padding: 0.8rem 0.9rem;
                min-height: 110px;
            }
            .command-card .card-name {
                font-size: 0.82rem;
            }
            .command-card .card-syntax-preview {
                font-size: 0.7rem;
            }
            .command-card .card-desc {
                font-size: 0.7rem;
            }
            .main-top-bar .actions-row button {
                font-size: 0.65rem;
                padding: 0.3rem 0.7rem;
            }
            .hamburger-btn {
                display: flex !important;
            }
        }

        @media (max-width: 500px) {
            .command-list {
                grid-template-columns: 1fr;
            }
            .main-scroll {
                padding: 0.6rem 0.6rem 5rem 0.6rem;
            }
        }

        .hamburger-btn {
            display: none;
            background: transparent;
            border: none;
            color: var(--neon-white);
            font-size: 1.3rem;
            cursor: pointer;
            padding: 0.3rem 0.5rem;
            border-radius: 8px;
            transition: 0.3s;
        }
        .hamburger-btn:hover {
            background: rgba(255, 255, 255, 0.03);
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(0, 255, 136, 0.2);
            border-radius: 10px;
        }

        /* Utility */
        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            border: 0;
        }
    </style>
</head>
<body>

    <canvas id="particles-canvas"></canvas>

    <!-- ===== APP SHELL ===== -->
    <div class="app-shell" id="app-shell">

        <!-- SIDEBAR -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <a href="#" class="sidebar-logo" onclick="resetToBrowse()">
                    🐍 Pyhub
                    <span class="sub">Reference Pro</span>
                </a>
            </div>
            <div class="sidebar-search-wrap">
                <span class="search-icon">🔍</span>
                <input type="text" id="sidebar-search" placeholder="Search commands..." oninput="onSidebarSearch()" />
            </div>
            <nav class="sidebar-nav" id="sidebar-nav">
                <div class="nav-section-title">📂 Categories</div>
                <button data-cat="all" class="active" onclick="selectCategory('all', this)">
                    📘 All Commands <span class="badge-cnt" id="badge-all">0</span>
                </button>
                <button data-cat="__favorites__" onclick="selectCategory('__favorites__', this)">
                    ⭐ Favorites <span class="badge-cnt" id="badge-fav">0</span>
                </button>
            </nav>
            <div class="sidebar-footer">
                <span><span class="dot"></span> Offline Ready</span>
                <span>v2.0</span>
            </div>
        </aside>

        <!-- SIDEBAR OVERLAY -->
        <div class="sidebar-overlay" id="sidebar-overlay" onclick="closeSidebar()"></div>

        <!-- MAIN -->
        <main class="main-content" id="main-content">
            <div class="main-top-bar">
                <button class="hamburger-btn" onclick="toggleSidebar()" aria-label="Menu">☰</button>
                <div class="breadcrumb" id="breadcrumb">
                    <span>📘</span>
                    <span class="active-bread" id="breadcrumb-label">All Commands</span>
                </div>
                <div class="actions-row">
                    <button onclick="exportJSON()" title="Export as JSON">📤 JSON</button>
                    <button onclick="exportCSV()" title="Export as CSV">📤 CSV</button>
                    <button id="toggle-fav-view" onclick="toggleFavoritesView()" title="Show favorites">⭐ Favorites</button>
                </div>
            </div>
            <div class="main-scroll" id="main-scroll">
                <div class="command-list" id="command-list"></div>
            </div>
        </main>

        <!-- BOTTOM NAV (Mobile) -->
        <nav class="bottom-nav" id="bottom-nav">
            <button class="active" data-view="browse" onclick="bottomNavAction('browse', this)">
                <span class="nav-icon">📘</span> Browse
            </button>
            <button data-view="search" onclick="bottomNavAction('search', this)">
                <span class="nav-icon">🔍</span> Search
            </button>
            <button data-view="favorites" onclick="bottomNavAction('favorites', this)">

            // ============ PARTICLES ============
            const canvas = document.getElementById('particles-canvas');
            const ctx = canvas.getContext('2d');
            let W, H, particles = [];
            const PARTICLE_COUNT = 80;
            const COLORS = ['rgba(0,255,136,', 'rgba(79,195,247,', 'rgba(232,232,240,'];

            class Particle {
                constructor() { this.reset(); }
                reset() {
                    this.x = Math.random() * W;
                    this.y = Math.random() * H;
                    this.size = Math.random() * 2 + 0.4;
                    this.speedX = (Math.random() - 0.5) * 0.4;
                    this.speedY = (Math.random() - 0.5) * 0.4;
                    this.opacity = Math.random() * 0.35 + 0.08;
                    this.colorIdx = Math.floor(Math.random() * COLORS.length);
                    this.pulse = Math.random() * Math.PI * 2;
                    this.pulseSpeed = 0.005 + Math.random() * 0.01;
                }
                update() {
                    this.x += this.speedX;
                    this.y += this.speedY;
                    this.pulse += this.pulseSpeed;
                    if (this.x < 0 || this.x > W) { this.speedX *= -1;
                        this.x = Math.max(0, Math.min(W, this.x)); }
                    if (this.y < 0 || this.y > H) { this.speedY *= -1;
                        this.y = Math.max(0, Math.min(H, this.y)); }
                    this.currentOpacity = this.opacity * (0.55 + 0.45 * Math.sin(this.pulse));
                }
                draw() {
                    const alpha = Math.max(0.02, Math.min(0.7, this.currentOpacity));
                    const color = COLORS[this.colorIdx] + alpha + ')';
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                    ctx.fillStyle = color;
                    ctx.shadowColor = color;
                    ctx.shadowBlur = 6;
                    ctx.fill();
                    ctx.shadowBlur = 0;
                }
            }

            function initParticles() {
                particles = [];
                for (let i = 0; i < PARTICLE_COUNT; i++) particles.push(new Particle());
            }

            function resizeCanvas() { W = canvas.width = window.innerWidth;
                H = canvas.height = window.innerHeight; }

            function drawParticles() {
                ctx.clearRect(0, 0, W, H);
                const grad = ctx.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, Math.max(W, H) * 0.7);
                grad.addColorStop(0, '#0c0c18');
                grad.addColorStop(1, '#04040a');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, W, H);
                particles.forEach(p => { p.update();
                    p.draw(); });
                for (let i = 0; i < particles.length; i++) {
                    for (let j = i + 1; j < particles.length; j++) {
                        const dx = particles[i].x - particles[j].x;
                        const dy = particles[i].y - particles[j].y;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        const maxDist = 120;
                        if (dist < maxDist) {
                            const alpha = (1 - dist / maxDist) * 0.1;
                            ctx.beginPath();
                            ctx.moveTo(particles[i].x, particles[i].y);
                            ctx.lineTo(particles[j].x, particles[j].y);
                            ctx.strokeStyle = COLORS[0] + alpha + ')';
                            ctx.lineWidth = 0.35;
                            ctx.stroke();
                        }
                    }
                }
                requestAnimationFrame(drawParticles);
            }

            function setupParticles() {
                resizeCanvas();
                initParticles();
                drawParticles();
            }
            window.addEventListener('resize', () => { resizeCanvas();

            // ============ STATE ============
            let currentCategory = 'all';
            let searchQuery = '';
            let favorites = new Set(JSON.parse(localStorage.getItem('pyhub_favorites') || '[]'));

            function saveFavorites() {
                localStorage.setItem('pyhub_favorites', JSON.stringify([...favorites]));
            }

            function toggleFavorite(cmdName) {
                if (favorites.has(cmdName)) {
                    favorites.delete(cmdName);
                } else {
                    favorites.add(cmdName);
                }
                saveFavorites();
                renderCommands();
                updateSidebarBadges();
                updateFavButtonState();
            }

            function isFavorite(cmdName) { return favorites.has(cmdName); }

            function getFilteredCommands() {
                let filtered = COMMANDS;
                if (currentCategory === '__favorites__') {
                    filtered = COMMANDS.filter(c => favorites.has(c.name));
                } else if (currentCategory !== 'all') {
                    filtered = COMMANDS.filter(c => c.cat === currentCategory);
                }
                if (searchQuery) {
                    const q = searchQuery.toLowerCase();
                    filtered = filtered.filter(c =>
                        c.name.toLowerCase().includes(q) ||
                        c.syntax.toLowerCase().includes(q) ||
                        c.desc.toLowerCase().includes(q) ||
                        c.cat.toLowerCase().includes(q)
                    );
                }
                return filtered;
            }

            // ============ ICONS ============
            function getIconForCategory(cat) {
                const icons = {
                    'Basics': '📘',
                    'Strings': '🔤',
                    'Lists': '📋',
                    'Dictionaries': '📚',
                    'Sets': '🔗',
                    'Control Flow': '⚙️',
                    'Functions': '🔧',
                    'OOP': '🧩',
                    'File I/O': '📂',
                    'Exception Handling': '🚨',
                    'Built‑in Functions': '🔢',
                    'Modules': '📦',
                    'Data Science': '📊',
                    'Async': '⏳',
                    'Trading / Quant': '💰',
                    'AI / ML': '🤖',
                    'Network': '🌐',
                    'Database': '🗄️',
                    'Advanced': '🧠'
                };
                return icons[cat] || '📌';
            }

            // ============ RENDER ============
            function renderCommands() {
                const filtered = getFilteredCommands();
                const listEl = document.getElementById('command-list');
                const breadcrumbLabel = document.getElementById('breadcrumb-label');

                if (currentCategory === '__favorites__') {
                    breadcrumbLabel.textContent = '⭐ Favorites';
                } else if (currentCategory === 'all') {
                    breadcrumbLabel.textContent = 'All Commands';
                } else {
                    breadcrumbLabel.textContent = currentCategory;
                }

                if (filtered.length === 0) {
                    listEl.innerHTML = `
                        <div class="empty-state">
                            <span class="icon">📭</span>
                            <p>No commands found</p>
                            <p class="sub">Try a different category or search term</p>
                        </div>`;
                    return;
                }

                listEl.innerHTML = filtered.map(c => {
                    const fav = isFavorite(c.name);
                    return `
                    <div class="command-card" onclick="openDetail('${c.name.replace(/'/g, "\\'")}')">
                        <div class="card-top">
                            <span class="card-icon">${getIconForCategory(c.cat)}</span>
                            <span class="card-name">${c.name}</span>
                            <span class="card-cat-tag">${c.cat}</span>
                        </div>
                        <div class="card-syntax-preview" onclick="event.stopPropagation(); copySyntax('${c.syntax.replace(/'/g, "\\'").replace(/\n/g, '\\n')}')" title="Click to copy syntax">${c.syntax.split('\n')[0]}</div>
                        <div class="card-desc">${c.desc}</div>
                        <div class="card-actions">
                            <button onclick="event.stopPropagation(); copySyntax('${c.syntax.replace(/'/g, "\\'").replace(/\n/g, '\\n')}')" title="Copy syntax">📋 Copy</button>
                            <button class="fav-btn${fav ? ' saved' : ''}" onclick="event.stopPropagation(); toggleFavorite('${c.name.replace(/'/g, "\\'")}')" title="${fav ? 'Remove from favorites' : 'Add to favorites'}">${fav ? '⭐' : '☆'}</button>
                        </div>

            function updateSidebarBadges() {
                document.getElementById('badge-all').textContent = COMMANDS.length;
                document.getElementById('badge-fav').textContent = favorites.size;

            function updateFavButtonState() {
                const btn = document.getElementById('toggle-fav-view');
                if (currentCategory === '__favorites__') {
                    btn.classList.add('fav-active');
                    btn.textContent = '⭐ Viewing Favorites';
                } else {
                    btn.classList.remove('fav-active');
                    btn.textContent = '⭐ Favorites';

            // ============ SIDEBAR NAV ============
            function buildSidebarNav() {
                const navEl = document.getElementById('sidebar-nav');
                const categories = [...new Set(COMMANDS.map(c => c.cat))].sort();
                let html = '<div class="nav-section-title">📂 Categories</div>';
                html +=
                    `<button data-cat="all" class="active" onclick="selectCategory('all', this)">📘 All Commands <span class="badge-cnt" id="badge-all">${COMMANDS.length}</span></button>`;
                html +=
                    `<button data-cat="__favorites__" onclick="selectCategory('__favorites__', this)">⭐ Favorites <span class="badge-cnt" id="badge-fav">${favorites.size}</span></button>`;

                categories.forEach(cat => {
                    const count = COMMANDS.filter(c => c.cat === cat).length;
                    html +=
                        `<button data-cat="${cat}" onclick="selectCategory('${cat}', this)">${getIconForCategory(cat)} ${cat} <span class="badge-cnt">${count}</span></button>`;
                });
                navEl.innerHTML = html;

            function selectCategory(cat, btnEl) {
                currentCategory = cat;
                searchQuery = '';
                document.getElementById('sidebar-search').value = '';
                document.getElementById('breadcrumb-label').textContent = cat === '__favorites__' ? '⭐ Favorites' :
                    cat === 'all' ? 'All Commands' : cat;
                // Update active states
                document.querySelectorAll('#sidebar-nav button').forEach(b => b.classList.remove('active'));
                if (btnEl) btnEl.classList.add('active');
                // Update bottom nav
                document.querySelectorAll('#bottom-nav button[data-view]').forEach(b => b.classList.remove('active'));
                const bottomBtn = document.querySelector(`#bottom-nav button[data-view="${cat === '__favorites__' ? 'favorites' : 'browse'}"]`);
                if (bottomBtn) bottomBtn.classList.add('active');
                updateFavButtonState();
                renderCommands();
                document.getElementById('main-scroll').scrollTop = 0;
                // Close sidebar on mobile
                if (window.innerWidth <= 900) closeSidebar();
            }

            function onSidebarSearch() {
                searchQuery = document.getElementById('sidebar-search').value.trim();
                if (searchQuery) {
                    currentCategory = 'all';
                    document.querySelectorAll('#sidebar-nav button').forEach(b => b.classList.remove('active'));
                    const allBtn = document.querySelector('#sidebar-nav button[data-cat="all"]');
                    if (allBtn) allBtn.classList.add('active');
                }
                updateFavButtonState();
                renderCommands();
            }

            function toggleFavoritesView() {
                if (currentCategory === '__favorites__') {
                    selectCategory('all', document.querySelector('#sidebar-nav button[data-cat="all"]'));
                } else {
                    selectCategory('__favorites__', document.querySelector('#sidebar-nav button[data-cat="__favorites__"]'));
                }
            }

            function resetToBrowse() {
                selectCategory('all', document.querySelector('#sidebar-nav button[data-cat="all"]'));
                document.getElementById('sidebar-search').value = '';
                searchQuery = '';
                renderCommands();

            function toggleSidebar() {
                const sidebar = document.getElementById('sidebar');
                const overlay = document.getElementById('sidebar-overlay');
                const isOpen = sidebar.classList.contains('open');
                if (isOpen) {
                    sidebar.classList.remove('open');
                    overlay.classList.remove('show');
                } else {
                    sidebar.classList.add('open');
                    overlay.classList.add('show');
                }
            }

            function closeSidebar() {
                document.getElementById('sidebar').classList.remove('open');
                document.getElementById('sidebar-overlay').classList.remove('show');
            }

            // ============ BOTTOM NAV ============
            function bottomNavAction(view, btnEl) {
                document.querySelectorAll('#bottom-nav button[data-view]').forEach(b => b.classList.remove(
                'active'));
                if (btnEl) btnEl.classList.add('active');
                switch (view) {
                    case 'browse':
                        selectCategory('all', document.querySelector('#sidebar-nav button[data-cat="all"]'));
                        break;
                    case 'search':
                        document.getElementById('sidebar-search').focus();
                        if (window.innerWidth <= 900) {
                            toggleSidebar();
                            setTimeout(() => document.getElementById('sidebar-search').focus(), 350);
                        }
                        break;
                    case 'favorites':
                        selectCategory('__favorites__', document.querySelector(
                            '#sidebar-nav button[data-cat="__favorites__"]'));
                        break;
                }
            }

            // ============ DETAIL MODAL ============
            function openDetail(cmdName) {
                const cmd = COMMANDS.find(c => c.name === cmdName);
                if (!cmd) return;
                const container = document.getElementById('modal-container');
                const fav = isFavorite(cmd.name);
                container.innerHTML = `
                    <div class="modal-overlay" id="modal-overlay" onclick="closeModal(event)">
                        <div class="modal-card" onclick="event.stopPropagation()">
                            <button class="modal-close" onclick="closeModalDirect()">✕</button>
                            <span style="font-size:2rem;">${getIconForCategory(cmd.cat)}</span>
                            <h2>${cmd.name} <span style="font-size:0.65rem;color:var(--neon-blue);font-weight:400;">${cmd.cat}</span></h2>
                            <p class="modal-desc">${cmd.desc}</p>
                            <div class="modal-syntax" onclick="copySyntax('${cmd.syntax.replace(/'/g, "\\'").replace(/\n/g, '\\n')}')" title="Click to copy">${cmd.syntax}</div>
                            ${cmd.example ? `<div class="modal-example">Example: ${cmd.example}</div>` : ''}
                            <div style="display:flex;gap:0.8rem;margin-top:1rem;flex-wrap:wrap;">
                                <button onclick="copySyntax('${cmd.syntax.replace(/'/g, "\\'").replace(/\n/g, '\\n')}')" style="background:var(--neon-green-dim);border:1px solid var(--neon-green-glow);color:var(--neon-green);padding:0.5rem 1.2rem;border-radius:25px;cursor:pointer;font-family:var(--font);font-weight:600;">📋 Copy Syntax</button>
                                <button onclick="toggleFavorite('${cmd.name.replace(/'/g, "\\'")}'); closeModalDirect();" style="background:${fav ? 'rgba(255,215,0,0.08)' : 'transparent'};border:1px solid ${fav ? 'rgba(255,215,0,0.3)' : 'rgba(255,255,255,0.08)'};color:${fav ? '#ffd700' : 'rgba(232,232,240,0.5)'};padding:0.5rem 1.2rem;border-radius:25px;cursor:pointer;font-family:var(--font);font-weight:600;">${fav ? '⭐ Saved' : '☆ Favorite'}</button>
                            </div>
                        </div>
                    </div>`;
                document.body.style.overflow = 'hidden';
            }

            function closeModal(e) {
                if (e && e.target !== document.getElementById('modal-overlay')) return;
                closeModalDirect();
            }

            function closeModalDirect() {
                const overlay = document.getElementById('modal-overlay');
                if (overlay) {
                    overlay.classList.add('closing');
                    setTimeout(() => {
                        document.getElementById('modal-container').innerHTML = '';
                        document.body.style.overflow = '';
                    }, 180);
                }
            }

            // ============ COPY ============
            function copySyntax(text) {
                const decoded = text.replace(/\\n/g, '\n').replace(/\\'/g, "'");
                navigator.clipboard.writeText(decoded).then(() => {
                    showToast('✅ Copied to clipboard');
                }).catch(() => {
                    const ta = document.createElement('textarea');
                    ta.value = decoded;
                    ta.style.position = 'fixed';
                    ta.style.opacity = '0';
                    document.body.appendChild(ta);
                    ta.select();
                    document.execCommand('copy');
                    document.body.removeChild(ta);
                    showToast('✅ Copied to clipboard');
                });
            }

            // ============ TOAST ============
            function showToast(msg) {
                const toast = document.getElementById('toast');
                toast.textContent = msg;
                toast.className = 'toast success';
                toast.classList.add('show');
                clearTimeout(toast._timeout);
                toast._timeout = setTimeout(() => toast.classList.remove('show'), 2200);
            }

            // ============ EXPORT ============
            function exportJSON() {
                const data = COMMANDS;
                const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `pyhub_commands_${new Date().toISOString().slice(0,10)}.json`;
                a.click();
                URL.revokeObjectURL(url);
                showToast('📤 JSON exported');
            }

            function exportCSV() {
                const headers = ['Category', 'Name', 'Syntax', 'Description', 'Example'];
                const rows = COMMANDS.map(c => [
                    c.cat,
                    c.name,
                    c.syntax.replace(/\n/g, '\\n'),
                    c.desc,
                    c.example || ''
                ]);
                const csvContent = '\uFEFF' + headers.join(',') + '\n' +
                    rows.map(row => row.map(v => `"${v.replace(/"/g, '""')}"`).join(',')).join('\n');
                const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `pyhub_commands_${new Date().toISOString().slice(0,10)}.csv`;
                a.click();
                URL.revokeObjectURL(url);
                showToast('📤 CSV exported');
            }

            // ============ KEYBOARD ============
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    closeModalDirect();
                    closeSidebar();
                }
                if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
                    e.preventDefault();
                    document.getElementById('sidebar-search').focus();
                }
            });

            // ============ INIT ============
            function init() {
                buildSidebarNav();
                updateSidebarBadges();
                updateFavButtonState();
                renderCommands();
                // Set initial bottom nav active
                const browseBtn = document.querySelector('#bottom-nav button[data-view="browse"]');
                if (browseBtn) browseBtn.classList.add('active');
                console.log('🚀 Pyhub Pro v2.0 · Ready');
            }

            // Expose globally
            window.selectCategory = selectCategory;
            window.onSidebarSearch = onSidebarSearch;
            window.toggleSidebar = toggleSidebar;
            window.closeSidebar = closeSidebar;
            window.bottomNavAction = bottomNavAction;
            window.openDetail = openDetail;
            window.closeModal = closeModal;
            window.closeModalDirect = closeModalDirect;
            window.copySyntax = copySyntax;
            window.toggleFavorite = toggleFavorite;
            window.toggleFavoritesView = toggleFavoritesView;
            window.resetToBrowse = resetToBrowse;
            window.exportJSON = exportJSON;
            window.exportCSV = exportCSV;

            if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
            else init();

            // Service Worker
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('service-worker.js').catch(() => {});
            }
        })();
    </script>
</body>
</html>
