<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline — Neon Prompt</title>
    <style>
        body {
            font-family: sans-serif;
            background: #08080e;
            color: #e8e8f0;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
            padding: 20px;
        }
        .container {
            max-width: 400px;
        }
        h1 { font-size: 2rem; color: #00d4ff; }
        p { color: #b0b0cc; }
        .icon { font-size: 4rem; display: block; margin-bottom: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <span class="icon">📡</span>
        <h1>You're Offline</h1>
        <p>No internet connection right now. Your installed app and saved prompts keep working offline.</p>
        <p style="margin-top:20px;font-size:0.8rem;color:#6a6a8a;">⚡ Local data is still available.</p>
    </div>
</body>
</html>
