  <style>
    /* ----------------------------------------------------------
       Landing page — minimal, self-contained, no external CSS.
       ---------------------------------------------------------- */

    *, *::before, *::after { box-sizing: border-box; }

    :root {
      --abyss: #03121a;
      --ink:   #02090d;
      --fg:    #efe6d6;
      --fg-dim: rgba(239, 230, 214, .62);
      --gold:  #d9a45c;
      --sand:  #efe6d6;
      --ease:  cubic-bezier(.22, .61, .36, 1);
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      background: var(--ink);
      color: var(--fg);
      font-family: 'Archivo', 'Helvetica Neue', Helvetica, Arial, system-ui, sans-serif;
      font-weight: 400;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }

    body {
      display: grid;
      place-items: center;
      padding: 24px;
      text-align: center;
      position: relative;
    }

    /* Ambient glow behind the wordmark */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 60% 40% at 50% 40%,
          rgba(217, 164, 92, .10) 0%,
          rgba(217, 164, 92, .03) 40%,
          transparent 70%),
        radial-gradient(ellipse 40% 60% at 50% 70%,
          rgba(26, 143, 138, .08) 0%,
          transparent 60%);
      pointer-events: none;
      z-index: 0;
      animation: pulse 8s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.75; }
      50%      { opacity: 1; }
    }

    main {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
    }

    .mark {
      font-size: clamp(38px, 11vw, 88px);
      font-weight: 600;
      letter-spacing: 0.42em;
      text-indent: 0.42em;
      line-height: 1;
      text-transform: uppercase;
      color: var(--fg);
      margin-bottom: 20px;
      animation: fadeIn 1.2s var(--ease) both;
    }

    .tag {
      font-size: clamp(11px, 2.8vw, 13px);
      font-weight: 500;
      letter-spacing: 0.5em;
      text-indent: 0.5em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 48px;
      animation: fadeIn 1.2s 0.2s var(--ease) both;
    }

    .btn {
      display: inline-block;
      padding: 16px 42px;
      border: 1px solid rgba(217, 164, 92, .5);
      color: var(--sand);
      text-decoration: none;
      font-family: inherit;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.34em;
      text-indent: 0.34em;
      text-transform: uppercase;
      border-radius: 2px;
      transition:
        border-color .45s var(--ease),
        background-color .45s var(--ease),
        color .45s var(--ease),
        transform .45s var(--ease);
      animation: fadeIn 1.2s 0.4s var(--ease) both;
    }

    .btn:hover,
    .btn:focus-visible {
      border-color: var(--gold);
      background: rgba(217, 164, 92, .10);
      color: #fff;
      transform: translateY(-1px);
      outline: none;
    }

    .btn:active {
      transform: translateY(0);
    }

    .location {
      margin-top: 56px;
      font-size: 10px;
      letter-spacing: 0.4em;
      text-indent: 0.4em;
      text-transform: uppercase;
      color: rgba(239, 230, 214, .34);
      animation: fadeIn 1.2s 0.6s var(--ease) both;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      body::before { animation: none; opacity: 0.8; }
      .mark, .tag, .btn, .location { animation: none; opacity: 1; }
      .btn { transition: none; }
    }

    /* RTL support (if the client prefers Arabic landing) */
    [dir="rtl"] .mark,
    [dir="rtl"] .tag,
    [dir="rtl"] .btn,
    [dir="rtl"] .location {
      letter-spacing: 0;
      text-indent: 0;
      font-family: 'Tajawal', 'Archivo', sans-serif;
    }

    [dir="rtl"] .mark { font-weight: 700; }
    [dir="rtl"] .tag  { font-size: 14px; letter-spacing: 0.05em; }
    [dir="rtl"] .btn  { font-size: 13px; letter-spacing: 0.05em; }
  </style>

  <main>

    <a class="btn" href="/deep-catch/">Enter the experience</a>
    <div class="location">Dubai</div>
