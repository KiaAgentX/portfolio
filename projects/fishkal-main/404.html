<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#04161d">
<title>404 — Not Found | FISHKAL</title>
<meta name="robots" content="noindex, follow">
<link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;box-sizing:border-box}
body{
  background:#02090d;color:#efe6d6;
  font:400 16px/1.6 'Archivo',system-ui,sans-serif;
  min-height:100dvh;display:grid;place-items:center;
  text-align:center;padding:24px;
}
.num{
  font:600 clamp(72px,18vw,160px)/1 'Archivo',sans-serif;
  letter-spacing:.12em;color:rgba(217,164,92,.4);
  margin-bottom:16px;
}
.msg{
  color:rgba(239,230,214,.62);font-size:14px;
  letter-spacing:.3em;text-transform:uppercase;
  margin-bottom:40px;
}
a.btn{
  display:inline-block;padding:14px 36px;
  border:1px solid rgba(217,164,92,.5);color:#efe6d6;
  text-decoration:none;font:500 11px/1 'Archivo',sans-serif;
  letter-spacing:.32em;text-transform:uppercase;
  border-radius:2px;transition:.3s;
}
a.btn:hover{background:rgba(217,164,92,.12);border-color:#d9a45c}
</style>
</head>
<body>
  <main>
    <div class="num">404</div>
    <div class="msg">This water is empty</div>
    <a class="btn" href="/">Back to shore</a>
  </main>
</body>
</html>
