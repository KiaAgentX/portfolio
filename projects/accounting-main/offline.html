<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>آفلاین | حسابداران</title>
    <meta name="theme-color" content="#0a0a12" />
    <link rel="icon" href="icon-192.png" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Tahoma, sans-serif;
            background: #0a0a12;
            color: #f0f0ff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 1.5rem;
        }
        .card {
            background: rgba(18, 18, 30, 0.88);
            border: 1px solid rgba(0, 255, 136, 0.12);
            border-radius: 18px;
            padding: 2.5rem 2rem;
            max-width: 420px;
        }
        .emoji { font-size: 3rem; }
        h1 { font-size: 1.4rem; margin: 1rem 0 0.5rem; }
        p { color: #9a9ab0; font-size: 0.95rem; line-height: 2; }
        a {
            display: inline-block;
            margin-top: 1.5rem;
            background: #00ff88;
            color: #0a0a12;
            font-weight: bold;
            padding: 0.7rem 2rem;
            border-radius: 10px;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="emoji">📡</div>
        <h1>اتصال اینترنت قطع است</h1>
        <p>صفحه‌ای که دنبالش هستی در حافظه آفلاین نیست.<br />صفحات ذخیره‌شده از داشبورد در دسترس‌اند.</p>
        <a href="index.html">بازگشت به داشبورد</a>
    </div>
</body>
</html>
