[project]
name = "hermesdesk-api"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
  "hermesdesk",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sse-starlette>=2.1",
  "python-jose[cryptography]>=3.3",
]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
