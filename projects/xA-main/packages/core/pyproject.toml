[project]
name = "hermesdesk"
version = "1.0.0"
description = "Hermes Desk domain core — oil-industry HITL agent desk"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "sqlalchemy[asyncio]>=2.0.35",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "redis>=5.1",
  "arq>=0.26",
  "httpx>=0.27",
  "openai>=1.50",
  "boto3>=1.35",
  "qdrant-client>=1.12",
  "orjson>=3.10",
  "bleach>=6.1",
  "email-validator>=2.2",
  "pyarrow>=17.0",
  "python-multipart>=0.0.12",
  "cryptography>=43.0",
]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["hermesdesk*"]
