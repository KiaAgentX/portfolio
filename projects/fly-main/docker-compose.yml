services:
  postgres:
    image: postgres:16-alpine
    container_name: fishkal-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fishkal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      POSTGRES_DB: ${POSTGRES_DB:-fishkal}
    ports:
      - "5432:5432"
    volumes:
      - fishkal_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fishkal}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: fishkal-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - fishkal_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  fishkal_pgdata:
  fishkal_redisdata:
