<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-label="Kia — Software Portfolio banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05060f"/>
      <stop offset="0.55" stop-color="#0a0f24"/>
      <stop offset="1" stop-color="#111c3c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.65">
      <stop offset="0" stop-color="#d4af37" stop-opacity="0.20"/>
      <stop offset="0.5" stop-color="#d4af37" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#d4af37" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d4af37" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#d4af37"/>
      <stop offset="1" stop-color="#d4af37" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="420" fill="url(#bg)"/>
  <rect width="1280" height="420" fill="url(#glow)"/>

  <!-- orbits -->
  <ellipse cx="640" cy="205" rx="440" ry="128" fill="none" stroke="#6ee7ff" stroke-opacity="0.07" stroke-width="1.5"/>
  <ellipse cx="640" cy="205" rx="350" ry="96" fill="none" stroke="#d4af37" stroke-opacity="0.10" stroke-width="1.5"/>

  <!-- stars -->
