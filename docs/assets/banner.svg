    <circle cx="640" cy="42" r="1.8" opacity="0.7"/><circle cx="760" cy="75" r="1.3" opacity="0.5"/>
    <circle cx="870" cy="55" r="2.1" opacity="0.8"/><circle cx="960" cy="140" r="1.1" opacity="0.4"/>
    <circle cx="1050" cy="80" r="1.7" opacity="0.7"/><circle cx="1150" cy="160" r="1.2" opacity="0.5"/>
    <circle cx="1220" cy="60" r="1.9" opacity="0.7"/><circle cx="70" cy="250" r="1.3" opacity="0.5"/>
    <circle cx="150" cy="330" r="1.8" opacity="0.6"/><circle cx="260" cy="300" r="1.1" opacity="0.4"/>
    <circle cx="370" cy="360" r="1.6" opacity="0.6"/><circle cx="480" cy="330" r="1.2" opacity="0.4"/>
    <circle cx="610" cy="372" r="1.5" opacity="0.5"/><circle cx="740" cy="340" r="1.2" opacity="0.4"/>
    <circle cx="860" cy="368" r="1.8" opacity="0.6"/><circle cx="980" cy="320" r="1.1" opacity="0.4"/>
    <circle cx="1090" cy="352" r="1.6" opacity="0.6"/><circle cx="1190" cy="290" r="1.3" opacity="0.5"/>
    <circle cx="60" cy="160" r="1.2" opacity="0.4"/><circle cx="1235" cy="210" r="1.4" opacity="0.5"/>
  </g>
  <g fill="#d4af37">
    <circle cx="220" cy="110" r="1.5" opacity="0.8"/><circle cx="1010" cy="110" r="1.5" opacity="0.8"/>
    <circle cx="440" cy="300" r="1.4" opacity="0.6"/><circle cx="900" cy="300" r="1.4" opacity="0.6"/>
  </g>
  <g fill="#6ee7ff">
    <circle cx="350" cy="130" r="1.6" opacity="0.7"/><circle cx="930" cy="200" r="1.4" opacity="0.6"/>
    <circle cx="540" cy="320" r="1.3" opacity="0.5"/>
  </g>

  <!-- corner ticks -->
  <g stroke="#d4af37" stroke-opacity="0.55" stroke-width="2" fill="none">
    <path d="M24 50 V24 H50"/><path d="M1230 24 H1256 V50"/>
    <path d="M1256 370 V396 H1230"/><path d="M50 396 H24 V370"/>
  </g>

  <!-- title block -->
  <text x="640" y="192" text-anchor="middle" font-family="'Segoe UI','DejaVu Sans',Arial,sans-serif" font-size="112" font-weight="bold" letter-spacing="16" fill="#f5efe2">K I A</text>
  <rect x="430" y="216" width="420" height="2" fill="url(#line)"/>
  <text x="640" y="258" text-anchor="middle" font-family="'Segoe UI','DejaVu Sans',Arial,sans-serif" font-size="24" letter-spacing="10" fill="#9fb0d8">SOFTWARE PORTFOLIO</text>
  <text x="640" y="300" text-anchor="middle" font-family="'Segoe UI','DejaVu Sans',Arial,sans-serif" font-size="16" letter-spacing="3" fill="#d4af37">AI AGENTS &#183; ALGORITHMIC TRADING &#183; IMMERSIVE WEB</text>
